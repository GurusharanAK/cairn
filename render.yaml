services:
  - type: web
    name: cairn
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build && cd ..
      export PYTHONPATH=$PWD/backend
      python backend/app/seeds/seed_demo_data.py
    startCommand: |
      export PYTHONPATH=$PWD/backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///cairn_demo.db
