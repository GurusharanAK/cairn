name: Keep Cairn Server Awake

on:
  schedule:
    # Ping every 10 minutes during demos/judging windows to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cairn /api/health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.CAIRN_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "CAIRN_HEALTHCHECK_URL repository variable is not set; skipping keep-alive ping."
            exit 0
          fi
          echo "Pinging $HEALTHCHECK_URL/api/health..."
          curl --fail --silent --show-error --max-time 20 "$HEALTHCHECK_URL/api/health"
          echo ""
